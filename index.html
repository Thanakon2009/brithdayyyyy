<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Celebration</title>
  <style>
    :root {
      --pink: #ff5e7d;
      --rose: #ff8fa3;
      --gold: #ffd166;
      --blue: #6ec5ff;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, #fff3c4 0%, #ffdce8 35%, #dfefff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.65) 0 1px, transparent 2px);
      background-size: 24px 24px;
      pointer-events: none;
      opacity: 0.4;
    }

    .content {
      text-align: center;
      z-index: 5;
      padding: 24px;
      max-width: 760px;
    }

    h1 {
      font-size: clamp(2.6rem, 6vw, 4rem);
      margin: 0 0 10px;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0,0,0,0.25);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(255,255,255,0.45);
      color: #fff;
      backdrop-filter: blur(6px);
      margin-bottom: 18px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .heart-btn {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
      border: none;
      background: linear-gradient(135deg, var(--pink), var(--rose));
      box-shadow: 0 16px 35px rgba(255, 94, 125, 0.45);
      cursor: pointer;
      animation: pulse 1.6s infinite ease-in-out;
      z-index: 20;
      display: grid;
      place-items: center;
      transform-origin: center;
      border-radius: 50% 50% 0 0;
      rotate: -45deg;
    }

    .heart-btn::before,
    .heart-btn::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      background: inherit;
      border-radius: 50%;
      top: 0;
    }

    .heart-btn::before { left: -55px; }
    .heart-btn::after { right: -55px; }

    .heart-btn span {
      position: relative;
      z-index: 2;
      font-size: 2rem;
      color: white;
      rotate: 45deg;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .heart-btn:hover {
      transform: translateX(-50%) scale(1.06);
      box-shadow: 0 20px 40px rgba(255, 94, 125, 0.55);
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .overlay.show { display: flex; }

    .card {
      width: min(560px, 100%);
      background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,234,240,0.95));
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      text-align: center;
      animation: pop 0.35s ease-out;
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .card img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      margin-bottom: 14px;
    }

    .greeting {
      margin: 8px 0 10px;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--pink);
    }

    .bilingual {
      color: #5d2d7b;
      font-size: 1rem;
      line-height: 1.7;
      margin-top: 8px;
    }

    .bilingual strong { color: var(--purple); }

    .close-btn {
      margin-top: 12px;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: white;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .balloon {
      position: fixed;
      bottom: -120px;
      width: 46px;
      height: 60px;
      border-radius: 50% 50% 45% 45%;
      opacity: 0.9;
      pointer-events: none;
      box-shadow: inset 0 -8px 18px rgba(255,255,255,0.35);
      animation: floatUp linear infinite;
      z-index: 1;
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 2px;
      height: 18px;
      background: rgba(120, 120, 120, 0.6);
      transform: translateX(-50%);
    }

    @keyframes floatUp {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      100% { transform: translate3d(0, -120vh, 0) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="balloons"></div>

  <div class="content">
    <div class="tag">🎉 Birthday Surprise 🎉</div>
    <h1>Happy Birthday!</h1>
    <p class="subtitle">
      A sweet celebration with warm wishes in Thai and Isan — full of joy, smiles, and lovely surprises.
    </p>
  </div>

  <button class="heart-btn" id="openCard" aria-label="Open birthday card">
    <span>♥</span>
  </button>

  <div class="overlay" id="overlay">
    <div class="card">
      <img src="yyy.jpg" alt="Birthday celebration image" />
      <div class="greeting">สุขสันต์วันเกิดนะ</div>
      <div class="bilingual">
        <p><strong>ภาษาไทย:</strong> สุขสันต์วันเกิดนะคะ/ครับ ขอให้มีความสุขและร่ำรวยทุกวัน</p>
        <p><strong>ภาษาอีสาน:</strong> ขอให้มีความสุขและสบายใจทุกวันนะ</p>
      </div>
      <button class="close-btn" id="closeCard">Close</button>
    </div>
  </div>

  <script>
    const balloonContainer = document.getElementById("balloons");
    const colors = [
      "linear-gradient(135deg, #ff7aa2, #ff4d6d)",
      "linear-gradient(135deg, #ffe066, #ffb703)",
      "linear-gradient(135deg, #85d8ff, #4ea8de)",
      "linear-gradient(135deg, #c792ff, #8b5cf6)",
      "linear-gradient(135deg, #a8ff78, #2ec4b6)"
    ];

    for (let i = 0; i < 18; i++) {
      const balloon = document.createElement("div");
      balloon.className = "balloon";
      balloon.style.left = `${Math.random() * 100}%`;
      balloon.style.background = colors[i % colors.length];
      balloon.style.animationDuration = `${8 + Math.random() * 6}s`;
      balloon.style.animationDelay = `${-Math.random() * 5}s`;
      balloon.style.transform = `scale(${0.7 + Math.random() * 0.5})`;
      balloonContainer.appendChild(balloon);
    }

    const openCard = document.getElementById("openCard");
    const overlay = document.getElementById("overlay");
    const closeCard = document.getElementById("closeCard");

    openCard.addEventListener("click", () => overlay.classList.add("show"));
    closeCard.addEventListener("click", () => overlay.classList.remove("show"));
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.classList.remove("show");
    });
  </script>
</body>
</html>
